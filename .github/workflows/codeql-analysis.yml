name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # IINA links against prebuilt mpv/FFmpeg dylibs that are not in the repo;
      # the project ships a script to fetch them (universal, so they cover the
      # x86_64 the CodeQL tracer builds as). Run it before init - it only
      # downloads, nothing worth tracing.
      - name: Fetch prebuilt dependencies
        run: other/download_libs.sh
        env:
          # Unauthenticated, the script's release lookup hits the runner IP's shared
          # rate limit and dies with HTTP 403 on iina/plugin-online-media.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The project links libnettle.8.dylib from $(PROJECT_DIR)/deps/lib, but
      # other/download_libs.sh does not ship it, so the arm64 link fails with
      # "ld: library 'nettle.8' not found". Take it from Homebrew, and alias
      # whatever major version brew has to the .8 name the project asks for.
      - name: Provide libnettle for the link step
        run: |
          set -euo pipefail
          brew install nettle
          mkdir -p deps/lib
          cp -a "$(brew --prefix nettle)"/lib/libnettle*.dylib deps/lib/
          cp -a "$(brew --prefix nettle)"/lib/libhogweed*.dylib deps/lib/ || true
          if [ ! -e deps/lib/libnettle.8.dylib ]; then
            real=$(ls deps/lib/libnettle.*.dylib | head -1)
            ln -sf "$(basename "$real")" deps/lib/libnettle.8.dylib
          fi
          ls -l deps/lib | grep -iE "nettle|hogweed"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      # autobuild used "-target iina", which drags in iina-plugin and its
      # GRMustache SPM package - that is where "no such module 'Mustache'"
      # came from. Building the app scheme keeps to the main target.
      - name: Build
        run: |
          xcodebuild build \
            -project iina.xcodeproj \
            -scheme iina \
            -destination 'generic/platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"